version: '3.8'

services:
  voice-studio:
    image: python:3.10-slim
    restart: unless-stopped

    networks:
      - default
      - proxy

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "${PORT:-7865}:5173"
      - "${BACKEND_PORT:-8885}:8880"

    environment:
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: "1"
      HOST: 0.0.0.0
      VITE_HOST: 0.0.0.0

    volumes:
      - voice_studio_data:/app

    working_dir: /app

    command: >
      bash -c "
      set -e;

      echo '================================================';
      echo 'Installing System Packages';
      echo '================================================';

      for i in {1..5}; do
        apt-get update && break || sleep 3;
      done;

      apt-get install -y --no-install-recommends \
        curl \
        git \
        ffmpeg \
        espeak-ng \
        build-essential \
        sed;

      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -;
      apt-get install -y nodejs;

      echo '================================================';
      echo 'Fetching Latest Source';
      echo '================================================';

      if [ ! -d .git ]; then
          git clone https://github.com/echowkidar/tts.git .
      else
          git fetch origin
          git reset --hard origin/main
      fi;

      echo '================================================';
      echo 'Installing Python Packages';
      echo '================================================';

      python -m pip install --no-cache-dir --upgrade pip;

      if [ -f requirements.txt ]; then
          pip install --no-cache-dir -r requirements.txt;
      fi;

      echo '================================================';
      echo 'Installing Frontend Packages';
      echo '================================================';

      if [ -d frontend ]; then
          cd frontend;
          npm install;
          cd ..;
      fi;

      echo '================================================';
      echo 'Running Setup';
      echo '================================================';

      yes | python studio.py setup;

      echo '================================================';
      echo 'Starting Voice Studio';
      echo '================================================';

      python studio.py start
      "

volumes:
  voice_studio_data:

networks:
  proxy:
    external: true