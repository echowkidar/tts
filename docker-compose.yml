version: '3.8'

services:
  voice-studio:
    image: python:3.10-slim
    container_name: voice-studio
    restart: unless-stopped

    networks:
      - default
      - proxy

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "${PORT:-7865}:5173"
      - "${BACKEND_PORT:-8885}:8880"

    environment:
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: "1"
      HOST: 0.0.0.0
      VITE_HOST: 0.0.0.0
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-51193166575-n2fvtsruk2lejtvjt6hckjg56rtd2ttf.apps.googleusercontent.com}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-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}"
      VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-51193166575-n2fvtsruk2lejtvjt6hckjg56rtd2ttf.apps.googleusercontent.com}"
      UPI_ID: "${UPI_ID:-8430478128@axl}"
      UPI_NAME: "${UPI_NAME:-Voice Studio by echowkidar.com}"

    volumes:
      - voice_studio_data:/app

    working_dir: /app

    command: >
      bash -c '
      echo "================================================";
      echo "Installing System Packages";
      echo "================================================";

      for i in 1 2 3 4 5; do
        apt-get update && break || sleep 3;
      done;

      apt-get install -y --no-install-recommends curl git ffmpeg espeak-ng build-essential sed ca-certificates;

      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -;

      apt-get install -y nodejs;

      echo "================================================";
      echo "Fetching Latest Source";
      echo "================================================";

      if [ ! -d /app/.git ]; then
          rm -rf /app/*
          git clone https://github.com/echowkidar/tts.git /app
      else
          cd /app
          git fetch origin
          git reset --hard origin/main
      fi;

      echo "================================================";
      echo "Installing Python Packages";
      echo "================================================";

      python -m pip install --upgrade pip;

      if [ -f requirements.txt ]; then
          pip install --no-cache-dir -r requirements.txt;
      fi;

      echo "================================================";
      echo "Installing Frontend Packages";
      echo "================================================";

      if [ -d frontend ]; then
          cd frontend
          npm install
          npm run build
          cd ..
      fi;

      echo "================================================";
      echo "Running Setup";
      echo "================================================";

      yes | python studio.py setup

      echo "================================================";
      echo "Starting Voice Studio";
      echo "================================================";

      exec python studio.py start
      '

volumes:
  voice_studio_data:

networks:
  proxy:
    external: true