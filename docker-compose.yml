version: '3.8'

services:
  voice-studio:
    build: .
    container_name: voice-studio
    restart: unless-stopped

    networks:
      - default
      - proxy

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "${PORT:-7865}:5173"
      - "${BACKEND_PORT:-8885}:8880"

    environment:
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: "1"
      HOST: 0.0.0.0
      VITE_HOST: 0.0.0.0

    volumes:
      - voice_studio_data:/app/backend/models
      - voice_studio_uploads:/app/backend/uploads
      - voice_studio_voices:/app/backend/voices
      - voice_studio_cache:/app/backend/cache

volumes:
  voice_studio_data:
  voice_studio_uploads:
  voice_studio_voices:
  voice_studio_cache:

networks:
  proxy:
    external: true